services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cardnest
      POSTGRES_PASSWORD: cardnest
      POSTGRES_DB: cardnest
    ports:
      - "5432:5432"
    volumes:
      - cardnest_pgdata:/var/lib/postgresql/data

volumes:
  cardnest_pgdata:
